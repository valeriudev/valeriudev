name: Update README

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours at :17 (off-peak minute — on-the-hour ticks get throttled)
  workflow_dispatch: # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README from template
        uses: muesli/readme-scribe@master
        env:
          # NOT the default GITHUB_TOKEN — markscribe needs a PAT with
          # read:user, repo:status, public_repo, read:org to read your
          # cross-repo activity. Store it as the README_SCRIBE_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.README_SCRIBE_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Tidy the rendered README
        run: |
          # markscribe renders through html/template, which escapes " ' + & < >
          # — decode them back (matters again once the blog RSS block goes live).
          sed -i 's/&#34;/"/g; s/&#39;/'\''/g; s/&#43;/+/g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g' README.md

      - name: List recently merged OSS PRs
        env:
          # README_SCRIBE_TOKEN (has read:org) so we can list the user's orgs
          # below — the default GITHUB_TOKEN can't read cross-org membership.
          GH_TOKEN: ${{ secrets.README_SCRIBE_TOKEN }}
        run: |
          # markscribe's recentPullRequests scans by creation date only, so a
          # burst of work PRs pushes OSS ones out of its window and merge dates
          # aren't available. Query merged PRs directly instead: newest 7 by
          # merge time, OSS only (own + NDA orgs excluded), max a year old.
          python3 - <<'EOF'
          import datetime, json, subprocess

          def gh_json(*args):
              out = subprocess.run(["gh", "api", *args],
                                   capture_output=True, text=True, check=True).stdout
              return json.loads(out)

          # Exclude the personal account plus every org the user belongs to, so
          # the list only surfaces contributions to third-party repos. Fetched
          # at run time (README_SCRIBE_TOKEN has read:org) so it never goes stale
          # as new orgs appear.
          EXCLUDE = {"valeriudev"} | {
              o["login"].lower() for o in gh_json("user/orgs", "-F", "per_page=100")
          }
          # The highest-volume own/NDA orgs are also excluded in the search query
          # so a burst of their PRs can't eat the window before an OSS one shows;
          # the full EXCLUDE set is still enforced client-side below.
          QUERY_EXCLUDE = ["valeriudev", "clickoutmedia", "teachtalk", "valgutu-templates"]
          SHOW = 7
          MAX_AGE_DAYS = 365  # "recently" shouldn't surface years-old merges

          def humanize(then, now):
              s = int((now - then).total_seconds())
              for size, unit, cap in ((60, "minute", 60), (3600, "hour", 24),
                                      (86400, "day", 7), (604800, "week", 5),
                                      (2592000, "month", 13)):
                  n = s // size
                  if 0 < n < cap:
                      return f"{n} {unit}{'s' if n != 1 else ''} ago"
              n = s // 31536000
              return f"{n} year{'s' if n != 1 else ''} ago" if n else "just now"

          # Search can't sort by merge date; sort=updated over a 100-deep window
          # is a safe superset — we re-order by the real merged_at below. Only the
          # high-volume orgs go in the query (a dozen -user: terms would blow the
          # query-length limit); the rest are filtered client-side below.
          query = "type:pr author:valeriudev is:merged " + \
                  " ".join(f"-user:{owner}" for owner in QUERY_EXCLUDE)
          data = json.loads(subprocess.run(
              ["gh", "api", "-X", "GET", "search/issues", "-f", f"q={query}",
               "-f", "sort=updated", "-f", "order=desc", "-F", "per_page=100"],
              capture_output=True, text=True, check=True).stdout)

          now = datetime.datetime.now(datetime.timezone.utc)
          prs = []
          for it in data["items"]:
              repo = it["repository_url"].split("/repos/")[-1]
              if repo.split("/")[0].lower() in EXCLUDE:  # defense in depth
                  continue
              merged = (it.get("pull_request") or {}).get("merged_at")
              if not merged:
                  continue
              dt = datetime.datetime.fromisoformat(merged.replace("Z", "+00:00"))
              if (now - dt).days > MAX_AGE_DAYS:
                  continue
              prs.append((dt, it["title"].strip(), it["html_url"], repo))
          prs.sort(key=lambda p: p[0], reverse=True)

          lines = []
          for dt, title, url, repo in prs[:SHOW]:
              title = title.replace("[", "\\[").replace("]", "\\]")
              lines.append(f"- [{title}]({url}) — [{repo}](https://github.com/{repo})"
                           f" · _{humanize(dt, now)}_")

          anchor = "#### Recently contributing to"
          text = open("README.md").read()
          if lines:
              text = text.replace(anchor, anchor + "\n" + "\n".join(lines), 1)
          else:
              text = text.replace(anchor + "\n", "", 1)  # never show an empty section
          open("README.md", "w").write(text)
          EOF

      - name: Commit the refreshed README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh README"
