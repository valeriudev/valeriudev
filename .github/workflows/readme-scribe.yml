name: Update README

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours at :17 (off-peak minute — on-the-hour ticks get throttled)
  workflow_dispatch: # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README from template
        uses: muesli/readme-scribe@master
        env:
          # NOT the default GITHUB_TOKEN — markscribe needs a PAT with
          # read:user, repo:status, public_repo, read:org to read your
          # cross-repo activity. Store it as the README_SCRIBE_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.README_SCRIBE_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Tidy the rendered README
        run: |
          # markscribe renders through html/template, which escapes " ' + & < >
          # in PR titles — decode them back to readable characters.
          sed -i 's/&#34;/"/g; s/&#39;/'\''/g; s/&#43;/+/g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g' README.md

          # "Recently contributing to" should be OSS only. Drop any PR line whose
          # repo belongs to me or to an NDA-bound org (these are filtered defensively;
          # private repos can't render under the token's public_repo scope anyway).
          sed -i -E '/github\.com\/(valeriudev|valgutu-templates|clickoutmedia)\//d' README.md

          # If no contribution lines survived, remove the lonely heading so the
          # profile never shows an empty section.
          grep -q '^- \[' README.md || sed -i '/^#### Recently contributing to$/d' README.md

      - name: Re-date PR lines from merge time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # markscribe only exposes .CreatedAt on pull requests, so a PR that sat
          # in review reads older than its merge. Re-date each line from the PR's
          # merged_at and re-sort the list so newest-merged stays on top.
          python3 - <<'EOF'
          import datetime, re, subprocess

          PR_LINE = re.compile(
              r'^(?P<head>- \[.*\]\(https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/pull/(?P<num>\d+)\).*· )_[^_]+_$'
          )

          def humanize(then, now):
              s = int((now - then).total_seconds())
              for size, unit, cap in ((60, "minute", 60), (3600, "hour", 24),
                                      (86400, "day", 7), (604800, "week", 5),
                                      (2592000, "month", 13)):
                  n = s // size
                  if 0 < n < cap:
                      return f"{n} {unit}{'s' if n != 1 else ''} ago"
              n = s // 31536000
              return f"{n} year{'s' if n != 1 else ''} ago" if n else "just now"

          now = datetime.datetime.now(datetime.timezone.utc)
          lines = open("README.md").read().split("\n")
          entries = []
          for i, line in enumerate(lines):
              m = PR_LINE.match(line)
              if not m:
                  continue
              merged = subprocess.run(
                  ["gh", "api", f"repos/{m['owner']}/{m['repo']}/pulls/{m['num']}",
                   "--jq", ".merged_at"],
                  capture_output=True, text=True).stdout.strip()
              if not merged or merged == "null":
                  continue  # lookup failed — keep the rendered creation date
              dt = datetime.datetime.fromisoformat(merged.replace("Z", "+00:00"))
              entries.append((i, f"{m['head']}_{humanize(dt, now)}_", dt))

          slots = [i for i, _, _ in entries]
          for slot, (_, line, _) in zip(slots, sorted(entries, key=lambda e: e[2], reverse=True)):
              lines[slot] = line
          open("README.md", "w").write("\n".join(lines))
          EOF

      - name: Commit the refreshed README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh README"
